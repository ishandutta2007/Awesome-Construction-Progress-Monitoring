<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="orangeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0)" />
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.8)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(220px); opacity: 0.9; }
        100% { transform: translateY(0px); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 5px #06b6d4); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 15px #3b82f6); }
      }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      @keyframes barGrow {
        0%, 100% { width: 140px; }
        50% { width: 190px; }
      }

      .scan-line {
        animation: scanline 6s ease-in-out infinite;
      }

      .pulsing-grid {
        animation: pulseGlow 4s ease-in-out infinite;
      }

      .card-float-1 {
        animation: floatCard1 5s ease-in-out infinite;
      }

      .card-float-2 {
        animation: floatCard2 6s ease-in-out infinite;
      }

      .bar-dynamic {
        animation: barGrow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Blueprint Background Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" class="pulsing-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Animated Graph & Metric Elements (Background Right Side) -->
  <g transform="translate(760, 40)" opacity="0.85">
    <!-- 3D BIM Mesh / Wireframe Graphic -->
    <polygon points="120,40 240,90 240,210 120,160" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" />
    <polygon points="120,40 0,90 0,210 120,160" fill="rgba(139, 92, 246, 0.08)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" />
    <polygon points="120,40 240,90 120,130 0,90" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Scanning Laser Line Overlay -->
    <rect class="scan-line" x="-20" y="30" width="280" height="4" fill="url(#laserBeam)" filter="url(#glowCyan)" />

    <!-- Floating Telemetry Pills -->
    <g class="card-float-1" transform="translate(140, 30)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="rgba(17, 24, 39, 0.85)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="20" cy="21" r="6" fill="#10b981" filter="url(#glowCyan)" />
      <text x="35" y="18" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="600">BIM ALIGNMENT</text>
      <text x="35" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">98.4% Matched</text>
    </g>

    <g class="card-float-2" transform="translate(-40, 180)">
      <rect x="0" y="0" width="175" height="42" rx="10" fill="rgba(17, 24, 39, 0.85)" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="20" cy="21" r="6" fill="#f59e0b" filter="url(#glowOrange)" />
      <text x="35" y="18" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REALITY CAPTURE</text>
      <text x="35" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">360° AI Scan Active</text>
    </g>

    <!-- Progress Bars -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="220" height="8" rx="4" fill="#374151" />
      <rect class="bar-dynamic" x="0" y="0" width="160" height="8" rx="4" fill="url(#cyanPurple)" />
    </g>
  </g>

  <!-- Dark Semi-transparent Backdrop for Foreground Text to Ensure 100% Readability -->
  <rect x="45" y="45" width="670" height="290" rx="16" fill="rgba(11, 15, 25, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- FOREGROUND CONTENT (Always clearly visible and on top) -->
  <g transform="translate(75, 80)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="265" height="28" rx="14" fill="url(#cyanPurple)" opacity="0.9" />
      <text x="14" y="18" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">
        🏗️ CONSTRUCTION TECH ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Awesome Construction
    </text>
    <text x="0" y="112" fill="url(#cyanPurple)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Progress Monitoring 🚀
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="152" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      Curated List of SaaS Platforms, 360° Reality Capture,
    </text>
    <text x="0" y="174" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      AI Deviation Tracking, 4D BIM Alignment &amp; Open-Source Tools
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 205)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="10" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📊 SaaS Pricing</text>

      <!-- Tag 2 -->
      <rect x="125" y="0" width="135" height="26" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="135" y="17" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⭐ Open-Source</text>

      <!-- Tag 3 -->
      <rect x="270" y="0" width="125" height="26" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="280" y="17" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📐 4D BIM &amp; AI</text>
    </g>
  </g>
</svg>
